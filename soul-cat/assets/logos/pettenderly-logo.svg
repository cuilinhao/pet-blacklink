<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C67A4A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D89156;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5A868;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Paw Print - 4 toes -->
  <ellipse cx="42" cy="28" rx="12" ry="16" fill="url(#pawGradient)" opacity="0.9" />
  <ellipse cx="78" cy="28" rx="12" ry="16" fill="url(#pawGradient)" opacity="0.9" />
  <ellipse cx="25" cy="52" rx="12" ry="16" fill="url(#pawGradient)" opacity="0.9" />
  <ellipse cx="95" cy="52" rx="12" ry="16" fill="url(#pawGradient)" opacity="0.9" />

  <!-- Main pad - heart shape with cat & dog inside -->
  <path
    d="M35 65 Q25 80 37 92 Q60 102 60 88 Q60 102 83 92 Q95 80 85 65 Q77 58 60 60 Q43 58 35 65 Z"
    fill="url(#pawGradient)"
    opacity="0.95"
  />

  <!-- White heart inside -->
  <ellipse cx="52" cy="75" rx="8" ry="9" fill="white" opacity="0.95" />
  <ellipse cx="68" cy="75" rx="8" ry="9" fill="white" opacity="0.95" />
  <path
    d="M60 72 Q52 72 52 75 Q52 80 60 85 Q68 80 68 75 Q68 72 60 72 Z"
    fill="white"
    opacity="0.95"
  />

  <!-- Cat silhouette (left, with pointy ears) -->
  <circle cx="51" cy="74" r="1.2" fill="#F26BA6" />
  <circle cx="53" cy="74" r="1.2" fill="#F26BA6" />
  <path d="M49 72 L50 75 M55 72 L54 75" stroke="#F26BA6" stroke-width="1" />

  <!-- Dog silhouette (right, with floppy ears) -->
  <circle cx="67" cy="74" r="1.2" fill="#5D5DF7" />
  <circle cx="69" cy="74" r="1.2" fill="#5D5DF7" />
  <ellipse cx="68" cy="76" rx="1.5" ry="2" fill="#5D5DF7" />
  <ellipse cx="65" cy="73" rx="2" ry="3" fill="#5D5DF7" opacity="0.7" />
  <ellipse cx="71" cy="73" rx="2" ry="3" fill="#5D5DF7" opacity="0.7" />
</svg>
